datasets:
  test:
    mzmine:
      template: "dda_orbitrap_pos"
      retention_time_range: [0.5, 31]
      approximate_feature_fwhm: 0.1
      minimum_feature_height: 50000
      blank_subtraction:
        min_blank_presence: 3
        fold_change_threshold: 3
      spectral_library_files:
        - "msnlib/20250828_targetmol_hts_np_pos_ms2.json"
        - "msnlib/20241003_mcebio_pos_ms2.json"
        - "msnlib/20241003_otavapep_pos_ms2.json"
        - "msnlib/20241003_enamdisc_pos_ms2.json"
        - "msnlib/20241003_nihnp_pos_ms2.json"
        - "msnlib/20241003_mcescaf_pos_ms2.json"
        - "msnlib/20241003_mcedrug_pos_ms2.json"
        - "msnlib/20241003_enammol_pos_ms2.json"
        - "msnlib/20250828_mcediv_50k_sub_pos_ms2.json"
    analysis:
      features:
        pca:
          samples_groupby: ["group", "fraction"]
          procedural_blanks_groupby: ["fraction"]
      annotations:
        formula_identification_score_cutoff: 0.8
        spectral_library_match_score_cutoff: 0.8
        structure_database_confidence_cutoff: 0.8
        msnovelist_score_cutoff: -3
      bioactivity:
        cc_spaces: ["C3", "C4", "D2", "D3"]
        query: "op"
        clusterable_embedding_umap_n_neighbors: 15
        clusterable_embedding_umap_min_dist: 0.0
        clusterable_embedding_umap_n_components: 5
        hdbdscan_min_samples: 5
        hdbscan_min_cluster_size: 10
      differential:
        condition_columns: ["fraction", "day_type"]
spectral_libraries:
  msnlib:
    zenodo_id: 16984129
