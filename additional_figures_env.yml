name: additional_figures_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.12

  # core scientific stack (modern, stable line)
  - numpy=1.26.*
  - scipy=1.14.*
  - pandas=2.2.*

  # ML stack
  - scikit-learn=1.6.*
  - statsmodels=0.14.*

  # visualization
  - matplotlib=3.9.*
  - seaborn=0.13.*

  # notebooks
  - jupyter
  - ipykernel

  - pip
  - pip:
      - matplotlib-venn
